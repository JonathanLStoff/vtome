[package]
name = "vtome"
version = "0.2.5"
edition = "2021"
authors = ["Jonathan Stoff <JonathanLStoff@gmail.com>"]
description = "Show images and video on a specific monitor — or a specific quadrilateral of one — with royalty-free codecs and no FFmpeg. GPU presentation with perspective-correct corner pinning, optional windowing, and a frame pipeline that stays in YUV until the shader."
license = "MIT"
repository = "https://github.com/jonathanlstoff/vtome"
readme = "README.md"
keywords = ["video", "av1", "display", "projection", "wgpu"]
categories = ["multimedia::video", "multimedia::images", "rendering"]

[dependencies]
thiserror = "2"

# --- Containers -----------------------------------------------------------
# Demuxing only. Neither of these decodes anything, so they are cheap: pure
# Rust, no C toolchain.
mp4 = { version = "0.14", optional = true }
matroska-demuxer = { version = "0.8", optional = true }

# --- Still images ---------------------------------------------------------
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }

# --- Presentation ---------------------------------------------------------
# `render` is a GPU and a surface; it does not imply a window. `window` adds
# one. An application embedding vtome in its own window (Tauri, a game engine)
# takes `render` + `embed` and never compiles winit.
wgpu = { version = "30", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
winit = { version = "0.30", optional = true }
# The `tauri` feature's host. Bare windows — no webview — are behind Tauri's
# `unstable` feature. Default features are off so vtome never chooses a runtime:
# the application's own tauri dependency brings wry.
tauri = { version = "2", optional = true, default-features = false, features = ["unstable"] }

# --- Encoding -------------------------------------------------------------
# rav1e: a pure-Rust AV1 encoder, so bundling one costs build time and no C
# toolchain. H.264 — the default output — is never encoded by anything bundled;
# only by the OS (`encode-platform`). See planning/TODO.md §14.
rav1e = { version = "0.8", optional = true, default-features = false, features = [
    "threading",
] }

# --- Audio ----------------------------------------------------------------
# atome is the audio engine: its output's play position is the clock video
# follows (`atome` feature), and its FLAC writer splits a film's audio out on
# import (`split-audio`). Default features off — vtome turns on exactly what it
# uses. 0.8.3 is the first release with `PlayClock`.
atome = { version = "0.8.3", optional = true, default-features = false }

# --- The operating system's codecs off Apple targets ------------------------
# Media Foundation on Windows: the H.264 encoder and decoder Windows ships, so
# — as with VideoToolbox — the licence is the OS vendor's. Android's MediaCodec
# is plain C in libmediandk and needs no crate. The same version Tauri uses,
# so an application with both builds one copy.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[features]
default = ["demux", "image"]

# Containers in, both pure Rust.
demux = ["dep:mp4", "dep:matroska-demuxer"]
# `vtome::import` and its queue: what the publish workflow tests.
import = ["transcode"]

# Decoders. Each gates a backend; none of them is implied by `demux`, because
# reading a file's structure and being able to decode its pictures are
# different capabilities and a build may want only the first.
decode-av1 = []
# The operating system's decoder. On Apple targets that is VideoToolbox, called
# through its C API directly, so this pulls in no crates — only system
# frameworks. It is also the only way vtome reads H.264: the licence is the OS
# vendor's, never ours.
decode-platform = ["dep:windows"]
all-decoders = ["decode-av1", "decode-platform"]

# Encoders. AV1 through the bundled rav1e; H.264 through the operating
# system's encoder only — VideoToolbox on Apple targets, system frameworks and
# no crates, for the same licensing reason as decoding.
encode-av1 = ["dep:rav1e"]
encode-platform = ["dep:windows"]
# Containers out: MP4 through the `mp4` crate's writer, WebM through a small
# Matroska writer of vtome's own.
mux = ["demux"]
# Decode, scale, encode, mux — and the AV1 encoder always comes with it, so an
# application that transcodes has AV1 wherever the OS has no H.264 encoder.
transcode = ["demux", "mux", "decode-platform", "encode-platform", "encode-av1"]

# Sound through atome: `Audio::atome(&output)` puts video on the output's
# clock and plays every video clip's soundtrack through it. Decoding the
# soundtrack is atome's `import` — which, until atome planning §3.3 moves AAC
# to the OS decoders, decodes AAC with Symphonia's bundled decoder.
atome = ["dep:atome", "atome/import"]
# `import`'s `output_audio`: a film's soundtrack to FLAC through atome.
split-audio = ["transcode", "atome", "atome/export"]

# Presentation.
render = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "dep:raw-window-handle"]
embed = ["render"]
window = ["render", "dep:winit"]
# The engine inside a Tauri application, which owns the event loop: vtome opens
# Tauri windows (bare ones, which is Tauri's `unstable` feature) and draws into
# them. Pulls in tauri and never winit.
tauri = ["render", "demux", "image", "dep:tauri"]

# Still images.
image = ["dep:image"]

[dev-dependencies]
tempfile = "3"
# The integration tests write their own image fixtures rather than carrying
# binary files, so the decoder and the fixture can never disagree.
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "identify"

[[example]]
name = "corner_pin"

[[example]]
name = "show"
required-features = ["window", "image"]

[[example]]
name = "play"
required-features = ["window", "demux", "decode-platform"]

[[example]]
name = "engine"
required-features = ["window", "demux", "image", "decode-platform"]

[[example]]
name = "contact_sheet"
required-features = ["render", "demux", "decode-platform", "image"]

